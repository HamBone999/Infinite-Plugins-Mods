# Anticheat. Everything starts in log-only mode ON PURPOSE.
# Watch /ac and the console for a few days of normal play before enabling any kick.
# This build has known desync bugs, so movement is the most likely to false-positive.

movement.detect=true
movement.kick=false
movement.max-blocks-per-packet=1.2
# One fast packet is not a speed hack. Mob knockback, a teleporter, standing up out of a
# crawl after a relog and a plain lag spike all cover several blocks in one packet.
# A real speed hack sustains it, so require this many over-limit packets in a row.
movement.consecutive-packets=3

reach.detect=true
reach.kick=false
reach.max-blocks=7.0

spam.detect=true
spam.kick=false
spam.max-per-10s=8

# X-ray is STATISTICAL. It measures the share of valuable ore among the blocks
# a player breaks. A high ratio is suspicious, not proof -- a lucky vein or a
# careful branch-miner can trip it. Never auto-kick on this one.
xray.detect=true
xray.kick=false
xray.sample-size=300
xray.ore-ratio=0.04

# Hovering or rising while airborne. Boats, ladders, water and lag can all
# look like this on a build with known desync -- watch before enabling.
fly.detect=true
fly.kick=false
fly.airborne-packets=40

# Action rates: nuker, scaffold, killaura, timer.
rate.detect=true
rate.kick=false
# Sand, gravel and leaves break almost instantly; mining them normally hit 11/s in the log.
# A nuker breaks far more than this.
rate.max-breaks-per-second=16
rate.max-places-per-second=10
rate.max-attacks-per-second=12
rate.max-move-packets-per-second=30

# Admin, owner and op are not checked at all. Staff fly, teleport and build
# fast as a matter of course, so they would trip these constantly.
# Set false if you want to test the checks on yourself.
exempt-staff=true

# consecutive flags before a kick fires, for checks that have kick=true
flags-before-kick=8
