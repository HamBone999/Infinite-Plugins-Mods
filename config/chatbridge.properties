# Minecraft <-> Discord chat bridge.
# THIS FILE HOLDS SECRETS. Do not paste it into a bug report or commit it.

# Minecraft -> Discord. Channel settings -> Integrations -> Webhooks -> New Webhook.
# This alone gives you a working one-way bridge; no bot account needed.
webhook-url=

# Discord -> Minecraft. Needs a bot in the server with Read Messages and
# Message Content Intent, plus the channel id (Developer Mode -> Copy ID).
bot-token=
channel-id=
discord-to-minecraft=false

# Seconds between polls for new Discord messages. Minimum 2.
poll-seconds=3

relay-chat=true
relay-join-leave=true
relay-deaths=true

# Shown by /discord in game.
invite-url=

# Marks messages coming from Discord so they cannot be mistaken for a player.
discord-prefix=[Discord] 
