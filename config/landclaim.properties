# Land claim limits. Ops are unlimited and ignore all of this.
#
# budget = start-blocks + (blocks-per-hour * hours played), capped at max-blocks
#
# 1 chunk = 16x16 = 256 blocks.
# 262144 = a 512x512 square, i.e. a 16-chunk (256 block) radius.
start-blocks=262144
#
# 16384 = 64 chunks per hour played.
blocks-per-hour=16384
#
# 1048576 = 1024x1024. Nobody accrues past this.
max-blocks=1048576
