# Block logging. Every place and break is written to world/blocklog.log;
# this file only controls how much of it is kept in memory for querying.

# Entries held in memory. Lookups and rollbacks only see these -- anything
# older is still on disk but has to be read there. ~80 bytes each.
memory-entries=150000

# /bl purge drops entries older than this. Nothing purges automatically.
purge-days=30

# Attribute creeper and TNT craters to what set them off.
log-explosions=true

# Refuse a rollback larger than this. A mistyped filter is the usual cause.
max-rollback-blocks=100000

# History lines per page.
page-size=8
