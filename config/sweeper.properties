# Entity housekeeping. Merging is on; nothing is deleted unless you turn it on.

# Seconds between sweeps. Minimum 10.
interval-seconds=60

# Combine dropped stacks of the same item that are close together. This is the
# safe fix: it cuts the entity count without anyone losing an item, so it is on.
merge-items=true
merge-radius=2.0

# Delete dropped items older than this many seconds. 0 = never.
# OFF by default on purpose -- a server that eats the loot you died next to is
# worse than a server that lags. 600 (10 minutes) is a reasonable start.
item-lifetime-seconds=0

# Seconds of warning in chat before a sweep that deletes items. 0 = silent.
warn-seconds=10

# Trim mobs above this count, per world, furthest from a player first.
# 0 = never. Bosses, named mobs and tamed animals are never removed.
max-mobs-per-world=0
